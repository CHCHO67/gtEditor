[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gt-editor"
version = "0.1.0"
description = "PySide6 table ground-truth correction editor for Docling-style table JSON/PNG pairs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "PySide6>=6.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
gt-editor = "gt_editor.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["gt_editor"]
