[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gt-editor"
version = "0.1.0"
description = "PySide6 table ground-truth correction editor for Docling-style table JSON/PNG pairs"
requires-python = ">=3.10"
dependencies = [
  "Pillow>=10",
  "PySide6>=6.6",
]

[project.scripts]
gt-editor = "gt_editor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gt_editor"]
